apiVersion: v1
kind: ConfigMap
metadata:
  name: data-service-config
  namespace: actividad1
data:
  CLOUD_PROVIDER: gcp
  DATABASE_PROVIDER: cloud-sql
  OTEL_SERVICE_NAME: data-service
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.actividad1.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=gcp,service.namespace=maestria
  CHAOS_LATENCY_MS: "0"
  CHAOS_ERROR_RATE: "0"
