apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-products-deployment
  labels:
    app: inventario-products
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventario-products
  template:
    metadata:
      labels:
        app: inventario-products
    spec:
      containers:
        - name: inventario-products
          image: tuusuario/inventario-products:latest
          ports:
            - containerPort: 9090
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://inventario-products-mysql:3306/maestria-inventario-products"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: SPRING_DATASOURCE_PASSWORD
