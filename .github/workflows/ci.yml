name: CI DevSecOps

on:
  push:
    branches:
      - '**'          # corre en todas las ramas
  pull_request:
    branches:
      - '**'          # corre en todos los PR
  workflow_dispatch:   # ejecución manual

permissions:
  contents: read

jobs:
  ci-devsecops:
    name: Build, Test, Docker and Security Scan
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: maestria_inventario_products
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/maestria_inventario_products
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    steps:
      # 🔹 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔹 2. Configurar JDK 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 🔹 3. Permisos Gradle
      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      # 🔹 4. Compilar y correr pruebas
      - name: Run tests
        run: ./gradlew clean test --no-daemon

      # 🔹 5. Construir artefacto
      - name: Build application artifact
        run: ./gradlew bootJar --no-daemon

      # 🔹 6. Construir imagen Docker
      - name: Build Docker image
        run: docker build -t inventory-products:${{ github.sha }} .

      # 🔹 7. Escaneo de seguridad con Trivy
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: inventory-products:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # 🔹 8. Escaneo de dependencias con Snyk
      - name: Snyk Security Scan
        uses: snyk/actions/gradle@master
        with:
          command: test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
