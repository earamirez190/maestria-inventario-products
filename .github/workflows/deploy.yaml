name: CI/CD - Build, Push & Deploy

on:
  push:
    branches: [ "main" ]   # Se ejecuta cuando haces push a main
  workflow_dispatch:       # También puedes lanzarlo manualmente desde GitHub

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Dar permisos al wrapper
      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      # 3. Compilar el JAR con Gradle
      - name: Build JAR with Gradle
        run: ./gradlew clean build -x test --stacktrace --info

      # 4. Log in a Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Construir la imagen Docker usando el JAR generado
      - name: Build Docker image
        run: docker build -t tuusuario/inventario-products:latest .

      # 6. Subir la imagen a Docker Hub
      - name: Push to Docker Hub
        run: docker push tuusuario/inventario-products:latest

      # 7. Configurar acceso a Kubernetes
      - name: Set up Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      # 8. Crear/Actualizar secretos en Kubernetes
      - name: Apply Kubernetes Secrets
        run: |
          kubectl create secret generic mysql-secret \
            --from-literal=SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }} \
            --from-literal=SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # 9. Desplegar la aplicación en Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
