name: CI/CD DevSecOps

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Configurar JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      # 3. Dar permisos al wrapper
      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      # 4. Compilar y ejecutar pruebas
      - name: Build & Test with Gradle
        run: ./gradlew clean build test --stacktrace --info

      # 5. Análisis estático con SonarQube
      - name: SonarQube Scan
        uses: sonarsource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # 6. Log in a Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Construir imagen Docker
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/inventario-products:${{ github.sha }} .

      # 8. Escaneo de seguridad con Trivy
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.12.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/inventario-products:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true

      # 9. Subir imagen a Docker Hub
      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/inventario-products:${{ github.sha }}

      # 10. Actualizar manifiestos Kubernetes
      - name: Update Kubernetes manifests
        run: |
          sed -i "s|image: .*$|image: ${{ secrets.DOCKER_USERNAME }}/inventario-products:${{ github.sha }}|" k8s/deployment.yaml
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push
