apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: actividad1
  labels:
    app: data-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      serviceAccountName: data-service
      containers:
        - name: data-service
          image: us-central1-docker.pkg.dev/mydemo-505323/actividad1-images/data-service@sha256:e111309351bcf3ba38cea5cf92a22a8b8e7a737353c9f4c11bdee3ff3044fee5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: data-service-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: password
            - name: DATABASE_URL
              value: mysql://$(DB_USER):$(DB_PASSWORD)@127.0.0.1:3306/inventorydb
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.2
          args:
            - "--structured-logs"
            - "--port=3306"
            - "mydemo-505323:us-central1:inventory-cloudsql"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
