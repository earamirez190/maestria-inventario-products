global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:9090']
        labels:
          app: 'maestria-inventario-products'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:9464']
        labels:
          app: 'otel-collector'

  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          app: 'otel-collector'

  - job_name: 'spring-boot-audit-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['service-b:9090']
        labels:
          app: 'maestria-inventario-audit'

  - job_name: 'spring-boot-data-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['data-service:9090']
        labels:
          app: 'maestria-inventario-data-service'
