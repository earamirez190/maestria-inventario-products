# OpenTelemetry SDK bootstrap / example configuration

# Este archivo contiene ejemplos y recomendaciones para configurar el SDK en cada servicio.
# Recomendación mínima de variables de entorno (exportar en container/pod):
# OTEL_SERVICE_NAME=data-service
# OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
# OTEL_TRACES_SAMPLER=parentbased_always_on
# OTEL_METRICS_EXPORTER=otlp
#
# The local compose stack exposes the end-to-end validation route:
# GET /api/observability/data/products
# app -> service-b -> data-service -> PostgreSQL

