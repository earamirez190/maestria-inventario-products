apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-products-deployment
  labels:
    app: inventario-products
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventario-products
  template:
    metadata:
      labels:
        app: inventario-products
    spec:
      containers:
        - name: inventario-products
          image: tuusuario/inventario-products:latest
          ports:
            - containerPort: 9090
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/inventario_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "rootpassword"
