apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: actividad1
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
          - key: deployment.environment
            value: gcp
            action: upsert
          - key: cloud.provider
            value: gcp
            action: upsert
      batch:
        timeout: 5s
    exporters:
      googlecloud:
        project: mydemo-505323
        log:
          default_log_name: maestria-observability
      prometheus:
        endpoint: 0.0.0.0:9464
      debug:
        verbosity: basic
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [googlecloud, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [googlecloud, prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [googlecloud, debug]
