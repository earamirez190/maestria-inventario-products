apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-products-deployment
  labels:
    app: inventario-products
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventario-products
  template:
    metadata:
      labels:
        app: inventario-products
    spec:
      containers:
        - name: inventario-products
          image: <DOCKER_USERNAME>/inventario-products:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
