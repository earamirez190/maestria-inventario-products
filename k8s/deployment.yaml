apiVersion: apps/v1
kind: Deployment
metadata:
  name: maestria-inventario-products
  namespace: actividad1
  labels:
    app: maestria-inventario-products
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maestria-inventario-products
  template:
    metadata:
      labels:
        app: maestria-inventario-products
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL..."
                sleep 2
              done
      containers:
        - name: maestria-inventario-products
          image: us-central1-docker.pkg.dev/proyect-otel-final-512002/actividad1-images/maestria-inventario-products:lab-integrador
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SERVER_PORT
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_JPA_HIBERNATE_DDL_AUTO
            - name: PRODUCT_AUDIT_ENABLED
              value: "true"
            - name: PRODUCT_AUDIT_URL
              value: http://service-b:9090
            - name: DATA_SERVICE_PROXY_URL
              value: http://service-b:9090
            - name: OTEL_SERVICE_NAME
              value: maestria-inventario-products
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.actividad1.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=gcp,service.namespace=maestria
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
