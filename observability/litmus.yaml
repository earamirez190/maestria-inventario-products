apiVersion: v1
kind: ServiceAccount
metadata:
  name: litmus-admin
  namespace: actividad1

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litmus-admin-clusterrolebinding-actividad1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: litmus-admin
    namespace: actividad1

---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: maestria-pod-network-latency-engine
  namespace: actividad1
spec:
  appinfo:
    appns: actividad1
    applabel: "app=maestria-inventario-products"
    appkind: deployment
  chaosServiceAccount: litmus-admin
  monitoring: false
  experiments:
    - name: pod-network-latency
      spec:
        components:
          env:
            - name: NETWORK_LATENCY
              value: "200"    # ms de latencia (ajusta)
            - name: DURATION
              value: "60"     # duración del experimento en segundos (ajusta)
            - name: TARGET_PODS
              value: ""       # opcional: nombre concreto de pod (vacío = selecciona por label)