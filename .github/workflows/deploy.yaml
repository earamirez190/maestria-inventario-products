name: CI/CD - Build, Push & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Configurar JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      # 3. Dar permisos al wrapper
      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      # 4. Compilar el JAR con Gradle
      - name: Build JAR with Gradle
        run: ./gradlew clean build -x test --stacktrace --info

      # 5. Log in a Docker Hub
      - name: Log in to Docker Hub 
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Construir la imagen Docker usando el JAR generado
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/inventario-products:latest .

      # 7. Subir la imagen a Docker Hub
      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/inventario-products:latest

      # 8. Configurar acceso a Kubernetes
      - name: Set up Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      # 9. Crear/Actualizar secretos en Kubernetes
      - name: Apply Kubernetes Secrets
        run: |
          kubectl create secret generic mysql-secret \
            --from-literal=SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }} \
            --from-literal=SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f - --validate=false

      # 10. Desplegar la aplicación en Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml --validate=false
          kubectl apply -f k8s/service.yaml --validate=false
